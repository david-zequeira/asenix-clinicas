name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build estático
        run: npm run build
        env:
          # Con dominio propio (variable de repo NEXT_PUBLIC_SITE_URL) el sitio va en
          # la raíz; sin ella, Pages lo sirve bajo /<repo>/ y hace falta el basePath.
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_SITE_URL == '' && format('/{0}', github.event.repository.name) || '' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
